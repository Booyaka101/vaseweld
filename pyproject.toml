[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaseweld"
version = "1.2.0"
description = "Weld two G-code files sliced from the same plate so spiral vase mode can start or stop partway up a print."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christo Bosch", email = "cbosch101@gmail.com" }]
keywords = [
    "3d-printing",
    "gcode",
    "spiral-vase",
    "vase-mode",
    "prusaslicer",
    "orcaslicer",
    "bambustudio",
    "post-processing",
    "slicer",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Booyaka101/vaseweld"
Repository = "https://github.com/Booyaka101/vaseweld"
Issues = "https://github.com/Booyaka101/vaseweld/issues"
Changelog = "https://github.com/Booyaka101/vaseweld/blob/main/CHANGELOG.md"

[project.scripts]
vaseweld = "vaseweld.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]
docs = ["pillow", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
