name: Demo pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the demo from the committed fixtures
        run: python sim/demo.py
      - name: The demo must weld cleanly, or there is nothing to show
        run: python sim/demo.py | tee /tmp/demo.txt && ! grep -q "FAILED" /tmp/demo.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
